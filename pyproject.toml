[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "microstructure-alpha-lab"
version = "0.1.0"
description = "Reproducible market microstructure research lab"
requires-python = ">=3.12"
dependencies = [
  "joblib==1.5.2",
  "numpy==2.3.4",
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "pydantic==2.12.3",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.2",
  "streamlit==1.50.0",
  "xgboost==3.1.1",
]

[project.optional-dependencies]
dev = [
  "cmake==4.1.2",
  "pytest==8.4.2",
  "ruff==0.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/microalpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"


