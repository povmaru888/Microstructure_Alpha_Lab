name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - if: runner.os == 'Windows'
        run: cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64
      - if: runner.os != 'Windows'
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --config Release
      - run: ctest --test-dir cpp/build --output-on-failure -C Release
      - run: pytest -q

